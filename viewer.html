<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>文档预览</title>
    <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico" />
    <style>
        :root {
            --accent: #3948d2;
            --bar: #22242e;
        }
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: #e9ebf0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        #bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: var(--bar);
            color: #eef;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
            z-index: 20;
            font-size: 14px;
        }
        #bar a.back {
            color: #c8cdee;
            text-decoration: none;
            white-space: nowrap;
        }
        #bar a.back:hover { color: #fff; }
        #bar .spacer { flex: 1 1 auto; }
        #bar .title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 60vw;
            color: #cfd3e8;
        }
        #bar .pages {
            color: #8b90a8;
            font-size: 12px;
            white-space: nowrap;
        }
        #stage {
            margin: 60px auto 20px;
            width: calc(100% - 28px);
            max-width: 920px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page {
            position: relative;
            margin: 0 auto 14px;
            background: #fff;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
            overflow: hidden;
        }
        .page canvas { display: block; }
        .page .ph {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b6bac6;
            font-size: 13px;
        }
        #msg {
            color: #666;
            font-size: 14px;
            margin-top: 30px;
            text-align: center;
            line-height: 1.7;
        }
        #hint {
            text-align: center;
            color: #aab;
            font-size: 12px;
            padding: 0 0 40px;
        }
    </style>
</head>

<body>
    <div id="bar">
        <a class="back" href="/">&larr;&nbsp;返回</a>
        <span class="title" id="title"></span>
        <span class="spacer"></span>
        <span class="pages" id="pages"></span>
    </div>

    <div id="stage">
        <div id="msg">加载中…</div>
    </div>
    <div id="hint">仅供在线预览 · 上下滚动浏览全部页面</div>

    <script src="/static/js/pdf.min.js"></script>
    <script>
        (function () {
            // ---- Deterrents: block download / copy / Ctrl shortcuts ----
            document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
            document.addEventListener('copy', function (e) { e.preventDefault(); });
            document.addEventListener('cut', function (e) { e.preventDefault(); });
            document.addEventListener('dragstart', function (e) { e.preventDefault(); });
            document.addEventListener('keydown', function (e) {
                var k = (e.key || '').toLowerCase();
                if (e.ctrlKey || e.metaKey) {
                    // block Ctrl/Cmd + C S P A U X V F G
                    if (['c', 's', 'p', 'a', 'u', 'x', 'v', 'f', 'g'].indexOf(k) !== -1) {
                        e.preventDefault();
                    }
                    // block Ctrl/Cmd + Shift + I / C / S / P (dev tools, etc.)
                    if (e.shiftKey && ['i', 'c', 's', 'p'].indexOf(k) !== -1) {
                        e.preventDefault();
                    }
                }
                if (e.key === 'F12') { e.preventDefault(); }
            });

            var params = new URLSearchParams(window.location.search);
            var file = params.get('f');
            var stage = document.getElementById('stage');
            var msg = document.getElementById('msg');

            if (!file) {
                msg.textContent = '缺少文件参数。';
                return;
            }

            pdfjsLib.GlobalWorkerOptions.workerSrc = '/static/js/pdf.worker.min.js';
            var url = encodeURI('/static/assets/pdf/' + file);
            document.getElementById('title').textContent = file;

            var pages = {}; // n -> { page, base, cv, vp, dpr, wrap, ph, rendered }

            function maxW() {
                return Math.min(920, Math.max(280, stage.clientWidth - 4));
            }
            function dprOf() {
                return Math.min(2, window.devicePixelRatio || 1);
            }

            function renderPage(n) {
                var p = pages[n];
                if (!p || p.rendered) return;
                p.rendered = true;
                var ctx = p.cv.getContext('2d');
                ctx.setTransform(p.dpr, 0, 0, p.dpr, 0, 0);
                p.page.render({ canvasContext: ctx, viewport: p.vp }).promise.then(function () {
                    if (p.ph) p.ph.style.display = 'none';
                }).catch(function () {
                    if (p.ph) p.ph.textContent = '第 ' + n + ' 页渲染失败';
                });
            }

            // Lazy render: placeholders for all pages are laid out immediately so the
            // scrollbar shows the full document; each page renders as it nears the viewport.
            var observer = ('IntersectionObserver' in window)
                ? new IntersectionObserver(function (entries) {
                    entries.forEach(function (en) {
                        if (en.isIntersecting) {
                            observer.unobserve(en.target);
                            renderPage(parseInt(en.target.getAttribute('data-n'), 10));
                        }
                    });
                }, { rootMargin: '800px 0px' })
                : null;

            pdfjsLib.getDocument(url).promise.then(function (doc) {
                var total = doc.numPages;
                document.getElementById('pages').textContent = '共 ' + total + ' 页';
                msg.style.display = 'none';

                for (var n = 1; n <= total; n++) (function (num) {
                    doc.getPage(num).then(function (page) {
                        var base = page.getViewport({ scale: 1 });
                        var scale = maxW() / base.width;
                        var vp = page.getViewport({ scale: scale });
                        var dpr = dprOf();

                        var wrap = document.createElement('div');
                        wrap.className = 'page';
                        wrap.setAttribute('data-n', num);
                        wrap.style.width = vp.width + 'px';
                        wrap.style.height = vp.height + 'px';

                        var cv = document.createElement('canvas');
                        cv.width = Math.floor(vp.width * dpr);
                        cv.height = Math.floor(vp.height * dpr);
                        cv.style.width = vp.width + 'px';
                        cv.style.height = vp.height + 'px';

                        var ph = document.createElement('div');
                        ph.className = 'ph';
                        ph.textContent = '第 ' + num + ' 页加载中…';

                        wrap.appendChild(cv);
                        wrap.appendChild(ph);
                        stage.appendChild(wrap);

                        pages[num] = {
                            page: page, base: base, cv: cv, vp: vp,
                            dpr: dpr, wrap: wrap, ph: ph, rendered: false
                        };

                        if (observer) observer.observe(wrap);
                        else renderPage(num); // no IntersectionObserver -> render everything
                    });
                })(n);
            }).catch(function (err) {
                msg.textContent = '无法加载文档。';
                console.error(err);
            });

            // On resize, recompute widths and re-render already-rendered pages.
            var rsTimer = null;
            window.addEventListener('resize', function () {
                clearTimeout(rsTimer);
                rsTimer = setTimeout(function () {
                    var w = maxW(), dpr = dprOf();
                    Object.keys(pages).forEach(function (k) {
                        var p = pages[k];
                        var vp = p.page.getViewport({ scale: w / p.base.width });
                        p.vp = vp;
                        p.dpr = dpr;
                        p.wrap.style.width = vp.width + 'px';
                        p.wrap.style.height = vp.height + 'px';
                        p.cv.width = Math.floor(vp.width * dpr);
                        p.cv.height = Math.floor(vp.height * dpr);
                        p.cv.style.width = vp.width + 'px';
                        p.cv.style.height = vp.height + 'px';
                        if (p.rendered) {
                            p.rendered = false;
                            renderPage(parseInt(k, 10));
                        }
                    });
                }, 200);
            });
        })();
    </script>
</body>

</html>
