<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reagan Li 李根</title>
    <meta name="description" content="Reagan Li (李根) — personal homepage. English and 中文." />

    <!-- This page is the language selector: it forwards to /en/ or /zh/.
         Per Google's guidance x-default points here, the non-language-specific entry point. -->
    <link rel="alternate" hreflang="en" href="https://reagan0007.github.io/en/" />
    <link rel="alternate" hreflang="zh-Hans" href="https://reagan0007.github.io/zh/" />
    <link rel="alternate" hreflang="x-default" href="https://reagan0007.github.io/" />

    <script>
        (function () {
            var SUPPORTED = ['en', 'zh'];
            var STORAGE_KEY = 'reagan-site-lang';

            function pick() {
                // 1. explicit ?lang= — also keeps pre-split links such as /?lang=zh working
                var q = new URLSearchParams(window.location.search).get('lang');
                if (SUPPORTED.indexOf(q) !== -1) return q;

                // 2. the visitor's previous choice
                try {
                    var saved = localStorage.getItem(STORAGE_KEY);
                    if (SUPPORTED.indexOf(saved) !== -1) return saved;
                } catch (e) { /* storage blocked — fall through */ }

                // 3. browser language
                var langs = navigator.languages || [navigator.language || ''];
                for (var i = 0; i < langs.length; i++) {
                    if ((langs[i] || '').toLowerCase().indexOf('zh') === 0) return 'zh';
                }

                // 4. default
                return 'en';
            }

            // replace() so the selector does not land in the back-button history
            window.location.replace('/' + pick() + '/' + window.location.hash);
        })();
    </script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #3948d2;
        }

        a {
            color: #3948d2;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid #3948d2;
            border-radius: 999px;
            padding: 0.4rem 1.2rem;
        }

        a:hover {
            background: #3948d2;
            color: #fff;
        }
    </style>
</head>

<body>
    <!-- Shown only if the redirect does not fire (no JS, or a crawler). -->
    <p>Reagan Li&ensp;|&ensp;李根</p>
    <p><a href="/en/">English</a>&ensp;<a href="/zh/">中文</a></p>
</body>

</html>
